name: StoreroomScanner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  StoreroomScanner:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StoreroomScanner
        INFOPLIST_KEY_CFBundleDisplayName: Storeroom Scanner
        INFOPLIST_KEY_NSCameraUsageDescription: Used to scan the storeroom and place item markers with AR.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Adds an optional coarse location tag to a saved level scan.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

